name: Build and deploy

# Every push to main publishes the site. Pull requests use pr-check.yml instead
# (they are built and checked, but never published).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push replaces one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Ask GitHub Pages for the site address
        id: pages
        uses: actions/configure-pages@v6

      - name: Build and check
        uses: ./.github/actions/build-site
        with:
          site-url: ${{ steps.pages.outputs.base_url }}

      - name: Lighthouse report (informational)
        # Prints scores in the run log. It never blocks a deployment.
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - name: Prepare the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
