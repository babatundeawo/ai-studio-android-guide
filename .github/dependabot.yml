# Keeps the automation in .github up to date. Dependabot opens one pull request
# a week when newer versions of the actions are released. Review and merge it
# from the GitHub website like any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-site
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
